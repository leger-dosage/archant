# The reference deployment: `BETTER_AUTH_SECRET=... docker compose up -d`
# runs the published image, and `docker compose up -d --build` builds this
# checkout instead.
# Variables come from the shell, or from a `.env` next to this file, which
# Compose reads for interpolation only. No `env_file: .env`: the development
# `DATABASE_URL` and `BETTER_AUTH_URL` there would point the container at a
# path that does not exist and at the Vite dev server's origin.
services:
  archant:
    # The published release, pinned with ARCHANT_VERSION, such as 1.2.3 or 1.2,
    # so a self-hoster needs this file and no checkout. `build` stays for
    # contributors: `up --build` builds the checkout and tags it with this
    # name, and `up` alone pulls only when no local image has it.
    image: ghcr.io/leger-dosage/archant:${ARCHANT_VERSION:-latest}
    build: .
    # Back after a reboot without anyone logging in.
    restart: unless-stopped
    # Node as PID 1 installs no SIGTERM handler, so the kernel drops the signal
    # and Docker kills the server ten seconds later, mid-write. An init in front
    # forwards it, and the container stops at once.
    init: true
    # Loopback only: published on every interface, the port would let anyone
    # on the network reach the server around a reverse proxy or Tailscale, and
    # write the X-Forwarded-For the sign-in limit trusts. docs/deployment.md
    # gives the compose.override.yml that opens it to the home network.
    ports:
      - "127.0.0.1:8787:8787"
    # A flaw in the server or a dependency cannot rewrite the code it runs or
    # drop a file to run later: the named volume on /data is the one path
    # that persists a write.
    read_only: true
    # Scratch space for Node and SQLite, in memory, gone at every restart.
    tmpfs:
      - /tmp
    # The server binds an unprivileged port and changes no owner or
    # permission, so it needs none of Docker's default capabilities.
    cap_drop:
      - ALL
    # No setuid binary in the image can hand a process more rights than it
    # started with.
    security_opt:
      - "no-new-privileges:true"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to at least 32 characters, for instance from openssl rand -base64 32}
      # The address the browser uses. Sign-ins and uploads from any other
      # origin are refused, so set it to the public URL behind a reverse proxy.
      BETTER_AUTH_URL: ${ARCHANT_URL:-http://localhost:8787}
      # Empty values fall back to the defaults in packages/api/src/env.ts.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Bank connection, optional; see docs/deployment.md. Without
      # ENCRYPTION_KEY the bank routes answer 503 and the rest of the app
      # works; with it, Réglages > Banques takes the Enable Banking
      # credentials. The two ENABLE_BANKING_* variables, both or neither,
      # override what the interface saved.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENABLE_BANKING_APPLICATION_ID: ${ENABLE_BANKING_APPLICATION_ID:-}
      ENABLE_BANKING_PRIVATE_KEY: ${ENABLE_BANKING_PRIVATE_KEY:-}
      # The bearer token of POST /api/sync. Empty, the scheduled sync is
      # refused and only the connection page's button syncs.
      SYNC_SECRET: ${SYNC_SECRET:-}
    volumes:
      # The whole database is this volume. Back it up, not the image.
      - archant-data:/data

volumes:
  archant-data:

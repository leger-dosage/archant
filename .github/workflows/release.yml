name: Release

# A `vX.Y.Z` tag publishes the image and a GitHub Release; the version is the
# tag, never a commit bumping package.json. No prerelease tag: a self-hoster
# on `latest` must never pull an unfinished build. Run by hand, the workflow
# is a dry run: the gate and both platform builds, nothing pushed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every CI job, `image` and `actionlint` included: nothing is published from
  # a commit the pull request checks would refuse.
  gate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: gate
    runs-on: ubuntu-latest
    # Two platforms, one of them emulated, take longer than a CI job.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # The build provenance attestation: an OIDC token to sign it, and the
      # right to record it on GitHub.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64 for a Raspberry Pi or an Apple silicon machine at home. Only the
      # runner stage's production install runs emulated: the Dockerfile builds
      # the interface on the runner's own platform.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `1.2.3`, `1.2` and `latest`, so a self-hoster pins a release, follows
      # its fixes, or takes whatever is newest. The OCI labels, license
      # included, are read from the repository.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/leger-dosage/archant
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      # CI's `image` job starts the amd64 image only. The arm64 one is built
      # under emulation, with its own libsql binary, so it starts here once
      # before anything is pushed. `version` is the tag without its `v`, what
      # the server's APP_VERSION accepts; a dry run has no tag, and gets a
      # version no release will ever carry rather than the branch name, which
      # the server would refuse.
      - name: Build the arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/arm64
          build-args: APP_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '0.0.0' }}
          tags: archant:arm64-probe
          load: true
          cache-from: type=gha
      - name: The arm64 image starts and answers ok
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          docker run --detach --name arm64-probe --platform linux/arm64 \
            --publish 127.0.0.1:8787:8787 \
            --env BETTER_AUTH_SECRET="$secret" \
            --env BETTER_AUTH_URL=http://localhost:8787 \
            archant:arm64-probe
          # Emulated, the start takes a while; five minutes bounds a hang.
          body=""
          for _ in $(seq 1 150); do
            body="$(curl --silent http://localhost:8787/api/health || true)"
            if [ "$body" = '{"data":{"status":"ok"}}' ]; then
              docker rm --force arm64-probe
              exit 0
            fi
            sleep 2
          done
          echo "last body: $body"
          docker logs arm64-probe
          exit 1
      # The SBOM and the maximal provenance travel inside the image index, so a
      # self-hoster reads what the image holds and how it was built from the
      # registry alone.
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: APP_VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '0.0.0' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      # A signed statement, kept on GitHub and pushed beside the image, that
      # this workflow at this tag built this digest: `gh attestation verify`
      # checks it (docs/deployment.md). A dry run pushed nothing to attest.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-name: ghcr.io/leger-dosage/archant
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record would need `artifact-metadata: write` on top; the
          # attestation alone is what `gh attestation verify` reads.
          create-storage-record: false

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # After the image, so a release never announces a version nobody can
      # pull. `--verify-tag` refuses to create a tag the push did not.
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

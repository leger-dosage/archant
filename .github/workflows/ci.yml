name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every job here as its gate before publishing.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request makes the previous run pointless. Every push to
# `main` keeps its own verdict. Called from release.yml, `github.workflow` is
# the caller's name and the event a tag push, so a release never cancels
# itself; release.yml sets no group of its own that this one could match.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The ruleset « main: pull request and CI » requires every job below by its
# name: renaming or adding one means updating that ruleset (AGENTS.md).
jobs:
  # One job per gate command: a red pipeline names the failing gate without
  # anyone opening the logs.
  gate:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    # A hung server would otherwise hold the runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: [lint:code, lint:format, typecheck, test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}
      # AGENTS.md: the gate must leave every tracked file as it found it.
      - run: git diff --exit-code

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright starts the API and the built interface itself, so nothing
      # else has to be booted here. Only the browser is missing from the runner.
      - run: pnpm --filter @archant/app exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # `vite build` regenerates the tracked routeTree.gen.ts; it must not change.
      - run: git diff --exit-code
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: failure()
        with:
          name: playwright-report
          path: packages/app/playwright-report
          retention-days: 7

  # The container is the reference deployment target (ADR 0002): build it,
  # start it as a household would, and check it answers and stops cleanly.
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Every `docker compose` command interpolates the file, and the secret is
      # required there, so it is generated once for the whole job.
      - name: Generate a session secret
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
      # A self-hoster without a checkout runs the published image, `latest`
      # unless ARCHANT_VERSION pins one.
      - name: The compose file names the published image
        run: |
          test "$(docker compose config --images)" = "ghcr.io/leger-dosage/archant:latest"
          test "$(ARCHANT_VERSION=1.2.3 docker compose config --images)" = "ghcr.io/leger-dosage/archant:1.2.3"
      # A release build, as the release workflow makes one, but with a version
      # no tag will ever carry.
      - run: docker compose build --build-arg APP_VERSION=0.0.0
      # `--wait` returns once the image's HEALTHCHECK passes, which needs the
      # migrations applied and the database answering. `--pull never`: the
      # file names the published image, and this job tests the pull request's
      # build, never a release someone pushed earlier.
      - run: docker compose up --detach --wait --pull never
      - name: The image carries the version it was built with
        run: test "$(docker compose exec -T archant printenv APP_VERSION)" = "0.0.0"
      # The server's default is loopback, which the published port cannot
      # reach; the health and interface steps below prove it answers.
      - name: The image listens on every interface of the container
        run: test "$(docker compose exec -T archant printenv HOST)" = "0.0.0.0"
      - name: Health answers ok
        run: |
          body="$(curl --silent --show-error --fail http://localhost:8787/api/health)"
          test "$body" = '{"data":{"status":"ok"}}'
      - name: The interface is served under /
        run: |
          result="$(curl --silent --output /dev/null --write-out '%{http_code} %{content_type}' http://localhost:8787/)"
          echo "$result"
          case "$result" in "200 text/html"*) ;; *) exit 1 ;; esac
      # Signed out, the session guard answers before the JSON 404; either way an
      # unknown API route must never get the interface page.
      - name: An unknown API route answers JSON
        run: |
          result="$(curl --silent --output "$RUNNER_TEMP/body.json" --write-out '%{http_code} %{content_type}' http://localhost:8787/api/nope)"
          echo "$result"
          test "$result" = "401 application/json"
          grep --quiet '"code":"UNAUTHORIZED"' "$RUNNER_TEMP/body.json"
      # The lock-down in docker-compose.yml, read back from the running
      # container rather than trusted from the file.
      - name: The container runs locked down
        run: |
          id="$(docker compose ps --quiet archant)"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$id")" = "true"
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$id")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$id")" = '["no-new-privileges:true"]'
          test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$id")" = '{"8787/tcp":[{"HostIp":"127.0.0.1","HostPort":"8787"}]}'
      # `/home/node` belongs to the server's user, so only the read-only root
      # can refuse the write there; `/app` is root's and would refuse anyway.
      - name: Only /data and /tmp are writable
        run: |
          docker compose exec -T archant touch /data/write-probe
          docker compose exec -T archant touch /tmp/write-probe
          if docker compose exec -T archant touch /home/node/write-probe; then exit 1; fi
          docker compose exec -T archant rm /data/write-probe /tmp/write-probe
      # Only the production dependencies of the API and `@archant/data`;
      # .pnpmfile.cjs keeps optional peers from pulling these back in.
      - name: The runtime image carries no build or test tooling
        run: |
          found="$(docker compose exec -T archant ls node_modules/.pnpm | grep -E '^(vitest|vite|drizzle-kit|typescript)@' || true)"
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      # The reset command docs/deployment.md gives for the container. Without a
      # terminal it must refuse before prompting, which proves it starts.
      - name: The in-container reset command runs
        run: |
          set +e
          docker compose exec -T archant node packages/api/src/cli/reset-password.ts admin@example.test 2> "$RUNNER_TEMP/reset.err"
          code=$?
          set -e
          cat "$RUNNER_TEMP/reset.err"
          test "$code" = "1"
          grep --quiet "Aucun terminal" "$RUNNER_TEMP/reset.err"
      # 143 is death by SIGTERM; 137 would mean Docker had to SIGKILL the
      # server once the one-second timeout ran out.
      - name: SIGTERM stops the server within one second
        run: |
          docker compose stop --timeout 1
          code="$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet archant)")"
          echo "exit code $code"
          test "$code" = "143"
      # An upgrade restarts on a volume already migrated.
      - name: A restart on the same volume answers ok
        run: |
          docker compose up --detach --wait --pull never
          body="$(curl --silent --show-error --fail http://localhost:8787/api/health)"
          test "$body" = '{"data":{"status":"ok"}}'
      # An upgrade with a migration to apply: the volume is rebuilt one
      # migration behind, by the image's own code, and the restart must copy
      # it to /data/backups before migrating. The journal copy goes to /tmp,
      # the one writable path besides /data.
      - name: A restart onto a pending migration copies the database first
        run: |
          docker compose stop
          docker compose run --rm --no-deps --workdir /app/packages/data --entrypoint node archant \
            --input-type=module --eval '
              import { rmSync, readdirSync } from "node:fs";
              import { migrateAllButLast } from "./testing/migrations.ts";
              for (const name of readdirSync("/data")) {
                if (name.startsWith("archant.db")) rmSync(`/data/${name}`);
              }
              await migrateAllButLast("file:/data/archant.db");
            '
          docker compose up --detach --wait --pull never
          copies="$(docker compose exec -T archant ls /data/backups)"
          echo "$copies"
          test "$(echo "$copies" | grep --count --extended-regexp '^archant-[0-9]{8}T[0-9]{6}Z-0\.0\.0\.db$')" = "1"
          test "$(echo "$copies" | wc -l)" = "1"
          body="$(curl --silent --show-error --fail http://localhost:8787/api/health)"
          test "$body" = '{"data":{"status":"ok"}}'
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  # A mistyped expression or an unquoted shell variable in a workflow shows
  # only when that workflow runs, and the release one runs on a tag push.
  # The image bundles shellcheck, which checks every `run:` script too.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # A tag or a base image tag can be moved to other code after review; a
      # commit SHA or a digest cannot. The job that pushes the image holds
      # `packages: write`, so every action and base image is pinned (AGENTS.md).
      - name: Every action and base image is pinned by digest
        run: |
          status=0
          if grep --line-number --extended-regexp '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml \
            | grep --invert-match --extended-regexp 'uses:[[:space:]]+(\./|[^@[:space:]]+@[0-9a-f]{40}([[:space:]]|$)|docker://[^@[:space:]]+@sha256:[0-9a-f]{64}([[:space:]]|$))'; then
            status=1
          fi
          if grep --with-filename --line-number --extended-regexp '^FROM[[:space:]]' Dockerfile \
            | grep --invert-match --extended-regexp '@sha256:[0-9a-f]{64}([[:space:]]|$)'; then
            status=1
          fi
          exit "$status"
      - uses: docker://rhysd/actionlint:1.7.11@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f
        with:
          args: -color

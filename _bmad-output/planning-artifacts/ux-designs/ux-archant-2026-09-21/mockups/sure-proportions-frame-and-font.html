<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Archant, proportions de Sure : cadre et police (maquette)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Inter:wght@400..700&display=swap" rel="stylesheet" />
<style>
/* Epic 14 exploration: Sure's proportions (Tailwind default type scale, 36px controls, 12px card radius,
   inset date groups) under Linear's colours. Two frames (A = Sure's rail + accounts column + top bar,
   B = one Linear-like sidebar at Sure's proportions) and two fonts (Geist 500/600, Inter 510/590 with
   Linear's cv01/ss03). Switch with the bar at the top. */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-feature-settings:var(--features);font-size:14px;line-height:20px;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

.font-geist{--font:'Geist',system-ui,sans-serif;--features:normal;--medium:500;--semibold:600}
.font-inter{--font:'Inter',system-ui,sans-serif;--features:"cv01","ss03";--medium:510;--semibold:590}

/* Linear Light and Classic Dark, as in DESIGN.md. "inset" is the grey behind Sure's grouped lists. */
.th-light{--bg:#F8F8F8;--container:#FFFFFF;--inset:#F2F2F3;--hover:#F4F4F4;--active:#EEEDEF;--t1:#282A30;--t2:#3C4149;--t3:#6C6B73;--b1:#E9E8EA;--line:#EAEAEB;--primary:#5E6AD2;--income:#1D7F34;--tint:10%;color-scheme:light}
.th-dark{--bg:#1A1B1E;--container:#1F2023;--inset:#252629;--hover:#2B2D30;--active:#27282B;--t1:#EEEFF1;--t2:#CBCCCE;--t3:#929496;--b1:#323336;--line:#2D2E31;--primary:#5E6AD2;--income:#2BA947;--tint:17%;color-scheme:dark}
.k-food{--c:#FC7840}.k-home{--c:#F0BF00}.k-transport{--c:#4EA7FC}.k-subs{--c:#9D6FE8}.k-income{--c:#27A644}.k-transfer{--c:#5E6AD2}.k-dep{--c:#9D6FE8}.k-inv{--c:#4EA7FC}.k-cc{--c:#EB5757}.k-loan{--c:#C95FD8}
.th-light .k-food{--ct:#A64F2A}.th-light .k-home{--ct:#826700}.th-light .k-transport{--ct:#326BA1}.th-light .k-subs{--ct:#7754B0}.th-light .k-income{--ct:#1C7630}.th-light .k-transfer{--ct:#535DB9}.th-light .k-dep{--ct:#7754B0}.th-light .k-inv{--ct:#326BA1}.th-light .k-cc{--ct:#B04141}.th-light .k-loan{--ct:#94469F}
.th-dark .k-food{--ct:#FEBCA0}.th-dark .k-home{--ct:#F5D454}.th-dark .k-transport{--ct:#A5D2FD}.th-dark .k-subs{--ct:#D2BDF4}.th-dark .k-income{--ct:#9CD6A9}.th-dark .k-transfer{--ct:#BABFEC}.th-dark .k-dep{--ct:#D2BDF4}.th-dark .k-inv{--ct:#A5D2FD}.th-dark .k-cc{--ct:#F6B5B5}.th-dark .k-loan{--ct:#E7B7ED}

/* Switcher, outside the mockup */
.switcher{position:fixed;z-index:10;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:6px;border-radius:12px;background:#111;color:#eee;font:13px/1 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.switcher .grp{display:flex;gap:2px;background:#222;border-radius:8px;padding:2px}
.switcher button{padding:6px 10px;border-radius:6px;color:#bbb}
.switcher button[aria-pressed=true]{background:#eee;color:#111}

.app{display:flex;height:100vh;background:var(--bg)}

/* Frame A: Sure's rail, accounts column and top bar */
.rail{width:84px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:16px 0;border-right:1px solid var(--b1)}
.rail .logo{width:36px;height:36px;display:grid;place-items:center;margin-bottom:12px;color:var(--t1)}
.rail .logo svg{width:28px;height:28px;fill:currentColor;stroke:none}
.rail nav{display:flex;flex-direction:column;gap:2px;align-items:center}
.rail a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;width:72px;color:var(--t3);text-decoration:none;font-size:11px;line-height:14px;font-weight:var(--medium)}
.rail a .tile{width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.rail a[aria-current] {color:var(--t1)}
.rail a[aria-current] .tile{background:var(--container);border:1px solid var(--b1)}
.rail .spacer{flex:1}
.rail .avatar{width:32px;height:32px;border-radius:999px;background:var(--active);display:grid;place-items:center;font-size:12px;font-weight:var(--medium);color:var(--t2)}
.accounts-col{width:320px;flex-shrink:0;padding:16px;border-right:1px solid var(--b1);overflow:auto}
.accounts-col h2{font-size:14px;font-weight:var(--medium);margin:4px 12px 12px}
.acc-group-title{display:flex;justify-content:space-between;padding:0 12px;margin:16px 0 4px;font-size:12px;line-height:16px;font-weight:var(--medium);text-transform:uppercase;letter-spacing:.02em;color:var(--t3)}
.acc{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px}
.acc:hover{background:var(--hover)}
.acc .name{flex:1;min-width:0}
.acc .name b{display:block;font-weight:var(--medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .name small{display:block;font-size:12px;line-height:16px;color:var(--t3)}
.acc .num{font-weight:var(--medium)}
.topbar{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;margin:0 -40px 24px;padding:16px 40px;background:var(--bg);border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:var(--medium);color:var(--t3)}
.crumbs span:last-child{color:var(--t1)}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--t3)}
.icon-btn:hover{background:var(--hover)}

/* Frame B: one sidebar holding navigation and accounts, Sure's proportions */
.sidebar{width:304px;flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--b1);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;font-size:16px;font-weight:var(--semibold);margin-bottom:16px}
.brand svg{width:22px;height:22px;fill:currentColor;stroke:none}
.sidebar nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--t2);text-decoration:none;font-weight:var(--medium)}
.sidebar nav a svg{color:var(--t3)}
.sidebar nav a:hover{background:var(--hover)}
.sidebar nav a[aria-current]{background:var(--active);color:var(--t1)}
.sidebar .acc{padding:6px 10px}
.sidebar .user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line);padding-top:16px}

/* Page body, same in both frames: Sure's transactions page */
main{flex:1;min-width:0;overflow:auto;padding:0 40px 48px}
.frame-b main{padding-top:32px}
.page{max-width:1120px}
.frame-a .page{max-width:none}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-head h1{font-size:24px;line-height:32px;font-weight:var(--medium);letter-spacing:-.01em}
.page-head p{color:var(--t3);margin-top:2px}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;font-weight:var(--medium)}
.btn-outline{border:1px solid var(--b1);background:var(--container)}
.btn-outline:hover{background:var(--hover)}
.btn-primary{background:var(--primary);color:#fff}
.card{background:var(--container);border:1px solid var(--b1);border-radius:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px}
.summary>div{padding:16px}
.summary>div+div{border-left:1px solid var(--line)}
.summary small{display:block;color:var(--t3);margin-bottom:8px}
.summary .num{font-size:20px;line-height:28px;font-weight:var(--medium)}
.list{padding:16px}
.toolbar{display:flex;gap:8px;margin-bottom:16px}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--b1);border-radius:8px;color:var(--t3)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px 140px;gap:12px;padding:12px 20px;margin-bottom:16px;border-radius:12px;background:var(--inset);font-size:12px;line-height:16px;font-weight:var(--medium);text-transform:uppercase;letter-spacing:.02em;color:var(--t3)}
.cols span:last-child{text-align:right}
.day{background:var(--inset);border-radius:12px;padding:4px;margin-bottom:24px}
.day-head{display:flex;justify-content:space-between;padding:8px 16px;font-size:12px;line-height:16px;font-weight:var(--medium);text-transform:uppercase;letter-spacing:.02em;color:var(--t3)}
.rows{background:var(--container);border:1px solid var(--b1);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px 140px;gap:12px;align-items:center;padding:10px 16px;min-height:56px}
.row+.row{border-top:1px solid var(--line)}
.row:hover{background:var(--hover)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who b{display:block;font-weight:var(--medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;font-size:12px;line-height:16px;color:var(--t3)}
.tint{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ct);background:color-mix(in oklab,var(--c) var(--tint),transparent)}
.tint.sm{width:28px;height:28px;border-radius:8px}
.tint.sm svg{width:14px;height:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:var(--medium);color:var(--ct);background:color-mix(in oklab,var(--c) var(--tint),transparent)}
.pill svg{width:12px;height:12px}
.account{display:flex;align-items:center;gap:8px;color:var(--t2);min-width:0}
.account span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amount{text-align:right;font-weight:var(--medium)}
.amount.in{color:var(--income)}
.hidden{display:none!important}
</style>
</head>
<body class="th-light font-geist">

<div class="switcher" role="toolbar" aria-label="Variantes">
  <div class="grp" data-set="frame"><button data-v="a" aria-pressed="true">A · cadre de Sure</button><button data-v="b" aria-pressed="false">B · une barre latérale</button></div>
  <div class="grp" data-set="font"><button data-v="geist" aria-pressed="true">Geist</button><button data-v="inter" aria-pressed="false">Inter</button></div>
  <div class="grp" data-set="theme"><button data-v="light" aria-pressed="true">Clair</button><button data-v="dark" aria-pressed="false">Sombre</button></div>
</div>

<div class="app frame-a" id="app">
  <aside class="rail only-a">
    <div class="logo" id="rail-logo"></div>
    <nav id="rail-nav"></nav>
    <div class="spacer"></div>
    <div class="avatar">GL</div>
  </aside>
  <aside class="accounts-col only-a"><h2>Comptes</h2><div id="acc-a"></div></aside>

  <aside class="sidebar only-b hidden">
    <div class="brand" id="brand"></div>
    <nav id="side-nav"></nav>
    <div id="acc-b"></div>
    <div class="user"><div class="avatar" style="width:28px;height:28px;border-radius:999px;background:var(--active);display:grid;place-items:center;font-size:12px">GL</div><span>Guillaume</span></div>
  </aside>

  <main>
    <div class="topbar only-a">
      <button class="icon-btn" aria-label="Replier les comptes" id="toggle"></button>
      <div class="crumbs"><span>Accueil</span><span>/</span><span>Opérations</span></div>
    </div>
    <div class="page">
      <div class="page-head">
        <div><h1>Opérations</h1><p>Septembre 2026, tous les comptes</p></div>
        <div class="actions"><button class="btn btn-outline" id="btn-import"></button><button class="btn btn-primary" id="btn-new"></button></div>
      </div>
      <div class="card summary">
        <div><small>Opérations</small><span class="num">124</span></div>
        <div><small>Revenus</small><span class="num" style="color:var(--income)">+3 240,00 €</span></div>
        <div><small>Dépenses</small><span class="num">−2 180,45 €</span></div>
      </div>
      <div class="card list">
        <div class="toolbar"><div class="search" id="search"></div><button class="btn btn-outline" id="btn-filter"></button></div>
        <div class="cols"><span>Opération</span><span>Catégorie</span><span>Compte</span><span>Montant</span></div>
        <div id="days"></div>
      </div>
    </div>
  </main>
</div>

<script>
const I = {
  logo:'<svg viewBox="0 0 32 32"><path fill-rule="evenodd" d="M4 28V15C4 8.4 9.4 3 16 3s12 5.4 12 12v13h-6.5v-7h-11v7H4ZM10.5 17V15a5.5 5.5 0 0 1 11 0v2Z"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .7-1.5l7-6a2 2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  tx:'<svg viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>',
  wallet:'<svg viewBox="0 0 24 24"><path d="M3 22h18"/><path d="M6 18v-7"/><path d="M10 18v-7"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M12 2 20 7H4z"/></svg>',
  repeat:'<svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  rules:'<svg viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>',
  filter:'<svg viewBox="0 0 24 24"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg>',
  panel:'<svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>',
  cart:'<svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 2h2l2.7 12.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L22 7H5.1"/></svg>',
  train:'<svg viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>',
  card:'<svg viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>',
  loan:'<svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
};
const nav = [['home','Accueil'],['tx','Opérations',true],['wallet','Comptes'],['repeat','Récurrent'],['rules','Règles'],['settings','Réglages']];
const accounts = [
  ['Actifs','48 912,30 €',[['k-dep','wallet','Compte courant','BoursoBank','3 412,18 €'],['k-dep','wallet','Livret A','BoursoBank','12 500,00 €'],['k-inv','chart','PEA','Fortuneo','33 000,12 €']]],
  ['Passifs','187 402,00 €',[['k-cc','card','Carte Visa','BoursoBank','402,00 €'],['k-loan','loan','Prêt immobilier','Crédit Agricole','187 000,00 €']]],
];
const days = [
  ['Lundi 28 septembre','3 opérations','−96,40 €',[
    ['k-food','cart','Carrefour Market','Carte · 14:32','Alimentation','Compte courant','k-dep','wallet','−62,15 €'],
    ['k-transport','train','SNCF Connect','Paris → Lyon','Transport','Carte Visa','k-cc','card','−34,25 €'],
    ['k-transfer','tx','Virement vers Livret A','Virement interne','Virement','Compte courant','k-dep','wallet','−200,00 €'],
  ]],
  ['Vendredi 25 septembre','2 opérations','+3 187,01 €',[
    ['k-income','up','Salaire septembre','Alvie','Salaire','Compte courant','k-dep','wallet','+3 240,00 €',true],
    ['k-subs','repeat','Spotify','Récurrent · tous les mois','Abonnements','Carte Visa','k-cc','card','−10,99 €'],
    ['k-home','home','EDF','Prélèvement','Logement','Compte courant','k-dep','wallet','−42,00 €'],
  ]],
];
const $ = id => document.getElementById(id);
$('rail-logo').innerHTML = I.logo;
$('brand').innerHTML = I.logo + '<span>Archant</span>';
$('rail-nav').innerHTML = nav.map(([i,l,a]) => `<a href="#"${a?' aria-current="page"':''}><span class="tile">${I[i]}</span>${l}</a>`).join('');
$('side-nav').innerHTML = nav.map(([i,l,a]) => `<a href="#"${a?' aria-current="page"':''}>${I[i]}${l}</a>`).join('');
const accHtml = accounts.map(([g,t,list]) => `<div class="acc-group-title"><span>${g}</span><span class="num">${t}</span></div>` +
  list.map(([k,i,n,s,b]) => `<div class="acc"><span class="tint sm ${k}">${I[i]}</span><span class="name"><b>${n}</b><small>${s}</small></span><span class="num">${b}</span></div>`).join('')).join('');
$('acc-a').innerHTML = accHtml;
$('acc-b').innerHTML = accHtml;
$('toggle').innerHTML = I.panel;
$('btn-import').innerHTML = I.upload + 'Importer';
$('btn-new').innerHTML = I.plus + 'Nouvelle opération';
$('btn-filter').innerHTML = I.filter + 'Filtrer';
$('search').innerHTML = I.search + 'Rechercher une opération';
$('days').innerHTML = days.map(([d,c,t,rows]) => `<div class="day"><div class="day-head"><span>${d} · ${c}</span><span class="num">${t}</span></div><div class="rows">` +
  rows.map(([k,i,n,s,cat,acc,ak,ai,amt,inc]) => `<div class="row"><div class="who"><span class="tint ${k}">${I[i]}</span><span style="min-width:0"><b>${n}</b><small>${s}</small></span></div><div><span class="pill ${k}">${I[i]}${cat}</span></div><div class="account"><span class="tint sm ${ak}" style="width:20px;height:20px;border-radius:6px">${I[ai]}</span><span>${acc}</span></div><div class="amount num${inc?' in':''}">${amt}</div></div>`).join('') + '</div></div>').join('');

const state = {frame:'a', font:'geist', theme:'light'};
function apply(){
  document.body.className = `th-${state.theme} font-${state.font}`;
  $('app').className = `app frame-${state.frame}`;
  document.querySelectorAll('.only-a').forEach(e => e.classList.toggle('hidden', state.frame !== 'a'));
  document.querySelectorAll('.only-b').forEach(e => e.classList.toggle('hidden', state.frame !== 'b'));
  document.querySelectorAll('.switcher .grp').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(state[g.dataset.set] === b.dataset.v))));
}
document.querySelectorAll('.switcher .grp').forEach(g => g.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state[g.dataset.set] = b.dataset.v; apply();
}));
const params = new URLSearchParams(location.search);
for (const k of Object.keys(state)) if (params.get(k)) state[k] = params.get(k);
apply();
</script>
</body>
</html>

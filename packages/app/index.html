<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Archant</title>
		<!-- The SVG follows the colour scheme; the PNG serves browsers without SVG icons. -->
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			// Applied before the first paint, so a dark-mode user never sees a white
			// flash. Kept in sync with src/lib/theme.ts, which owns the storage key.
			(function () {
				var choice = null;
				try {
					choice = localStorage.getItem("archant.theme");
				} catch (error) {}
				var dark =
					choice === "dark" ||
					(choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
